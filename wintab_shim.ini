# cursor      = put each pen packet exactly where the Windows cursor is (default, v2)
# passthrough = change nothing
mode=cursor
# nudge in pixels if there is a small constant offset left
offset_x=0
offset_y=0
# set true if moving the pen up moves the stroke down
flip_y=false
# true = log one line per packet batch (for debugging, makes the log big)
verbose=false
